name: Deploy to production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t grosfarm-price-monitor:latest .

      - name: Deploy container
        run: |
          docker rm -f price-monitor || true
          docker compose up -d

      - name: Verify
        run: |
          sleep 5
          docker ps | grep price-monitor
          curl -sf http://localhost:4173/health || true
