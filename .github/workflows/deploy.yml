name: Deploy to production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t grosfarm-price-monitor:latest .

      - name: Restart container
        run: |
          docker rm -f price-monitor || true
          docker run -d \
            --name price-monitor \
            --restart unless-stopped \
            --network host \
            -e HTTPS_PROXY=http://127.0.0.1:8118 \
            -e HTTP_PROXY=http://127.0.0.1:8118 \
            -e NO_PROXY=localhost,127.0.0.1 \
            -v price-data:/app/data \
            grosfarm-price-monitor:latest

      - name: Verify
        run: |
          sleep 5
          docker ps | grep price-monitor
