name: Update Auchan Catalog

on:
  workflow_dispatch:
  schedule:
    # Moscow time: 06:10, 12:10, 18:10, 23:10.
    - cron: "10 3,9,15,20 * * *"

permissions:
  contents: write

concurrency:
  group: auchan-agent
  cancel-in-progress: false

jobs:
  update-auchan:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates \
            xvfb \
            xauth \
            libasound2t64 \
            libatk-bridge2.0-0 \
            libatk1.0-0 \
            libcairo2 \
            libcups2 \
            libdbus-1-3 \
            libdrm2 \
            libgbm1 \
            libglib2.0-0 \
            libgtk-3-0 \
            libnss3 \
            libpango-1.0-0 \
            libx11-xcb1 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2

      - name: Install scraper dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-scraper.txt
          python -m camoufox fetch

      - name: Run Auchan agent
        run: xvfb-run -a python scripts/agents/run.py --store auchan

      - name: Commit updated data
        run: |
          git config user.name "grosfarm-agent"
          git config user.email "agent@grosfarm.local"

          if git diff --quiet -- data/auchan-products.json data/agent-status.json; then
            echo "No data changes to commit."
            exit 0
          fi

          git add data/auchan-products.json data/agent-status.json
          git commit -m "Update Auchan catalog [skip ci]"
          git push
